spring.application.name=DataFood_BackEnd
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# Evita que Hibernate mantenga la sesión/conexión abierta durante toda la respuesta HTTP
spring.jpa.open-in-view=false

# Reduce el pool de hilos de Tomcat (por defecto son 200, cada uno reserva ~1MB de stack = ~200MB solo en hilos inactivos)
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# ── Base de datos MySQL  ────────────────────────────────
DB_HOST=localhost
DB_PORT=3306
DB_NAME=DATAFOOD
DB_USER=root
DB_PASSWORD=K.D#VCQ4
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
upload.path=${user.dir}/uploads
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

LLM_API_KEY=sin-configurar-por-ahora

spring.mail.host=smtp.gmail.com
spring.mail.port=587
